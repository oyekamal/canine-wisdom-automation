<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: transparent; width: 1080px; height: 1920px; overflow: hidden; font-family: 'Georgia', serif; }
  .hook-wrap {
    position: absolute;
    top: 120px;
    left: 0; right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .horror-text {
    font-size: 62px;
    font-weight: 900;
    font-style: italic;
    color: #e00;
    text-align: center;
    padding: 0 60px;
    text-shadow: 0 0 20px rgba(220,0,0,0.8), 3px 3px 0 #000, -3px -3px 0 #000;
    opacity: 0;
    animation: flicker 0.6s 0.2s ease-in forwards;
    letter-spacing: 2px;
  }
  .sub-text {
    font-size: 36px;
    color: #ccc;
    text-align: center;
    padding: 0 80px;
    text-shadow: 2px 2px 0 #000;
    opacity: 0;
    animation: fadeIn 0.5s 0.7s ease-in forwards;
  }
  @keyframes flicker {
    0%   { opacity: 0; transform: scaleX(1.05); }
    30%  { opacity: 0.8; }
    50%  { opacity: 0.3; }
    70%  { opacity: 0.9; }
    100% { opacity: 1; transform: scaleX(1); }
  }
  @keyframes fadeIn {
    to { opacity: 1; }
  }
</style>
</head>
<body data-composition-id="root" data-duration="{{DURATION}}">
  <div class="hook-wrap" data-start="0s" data-duration="{{DURATION}}s">
    <div class="horror-text">{{HOOK_TEXT}}</div>
    <div class="sub-text">{{SUBTITLE}}</div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    window.__timelines["root"] = gsap.timeline({ paused: true });
  </script>
</body>
</html>
