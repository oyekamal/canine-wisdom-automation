<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: transparent; width: 1080px; height: 1920px; overflow: hidden; font-family: 'Impact', sans-serif; }
  .hook-wrap {
    position: absolute;
    top: 140px;
    left: 0; right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .emoji {
    font-size: 96px;
    line-height: 1;
    opacity: 0;
    transform: scale(0.5);
    animation: popIn 0.4s 0.1s ease-out forwards;
  }
  .hook-text {
    font-size: 68px;
    font-weight: 900;
    color: #fff;
    text-align: center;
    padding: 0 60px;
    text-shadow: 4px 4px 0 #000, -4px -4px 0 #000, 4px -4px 0 #000, -4px 4px 0 #000;
    opacity: 0;
    transform: translateY(30px);
    animation: slideUp 0.5s 0.3s ease-out forwards;
  }
  @keyframes popIn {
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes slideUp {
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body data-composition-id="root" data-duration="{{DURATION}}">
  <div class="hook-wrap" data-start="0s" data-duration="{{DURATION}}s">
    <div class="emoji">{{EMOJI}}</div>
    <div class="hook-text">{{HOOK_TEXT}}</div>
  </div>
</body>
</html>
